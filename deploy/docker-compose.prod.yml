# ============================================================
# 生产交付编排（甲方私有化部署）
#   准备：python deploy/init_env.py    # 生成 .env.production（密钥/管理员口令）
#   启动：docker compose -f deploy/docker-compose.prod.yml up -d
#   停止：docker compose -f deploy/docker-compose.prod.yml down
#
# 安全基线：
#   * PostgreSQL / Redis 只暴露在内部网络，不映射到宿主机端口
#   * API 以非 root 用户运行（镜像内 uid=10001），只读代码目录 + 数据卷
#   * 所有服务固定版本、配置日志滚动与重启策略
#   * 启动前必须通过后端 preflight 自检（生产不合规会拒绝启动）
# ============================================================
services:
  postgres:
    image: pgvector/pgvector:pg16-0.7.0
    container_name: rag-postgres
    environment:
      POSTGRES_USER: ${PG_USER:-rag}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?请在 .env.production 中设置 PG_PASSWORD}
      POSTGRES_DB: ${PG_DB:-ragdb}
      PGDATA: /var/lib/postgresql/data/pgdata
    # 不映射宿主机端口，仅内网访问
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../sql:/docker-entrypoint-initdb.d:ro   # 首次启动自动建表/索引/RLS
    networks: [rag-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-rag} -d ${PG_DB:-ragdb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: &default-logging
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  redis:
    image: redis:7.2-alpine
    container_name: rag-redis
    environment:
      # 仅用于下面的 healthcheck 展开；真正生效的口令在 command 的 --requirepass
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env.production 中设置 REDIS_PASSWORD}
    command: ["redis-server", "--maxmemory", "${REDIS_MAXMEMORY:-2gb}",
              "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes",
              "--requirepass", "${REDIS_PASSWORD:?请在 .env.production 中设置 REDIS_PASSWORD}"]
    expose:
      - "6379"
    volumes:
      - redisdata:/data
    networks: [rag-internal]
    healthcheck:
      # $$ 是 compose 的转义：容器内展开 $REDIS_PASSWORD（避免口令出现在 compose 文件里被回显）
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: rag-platform:${APP_VERSION:-1.2.1}
    container_name: rag-api
    env_file:
      - ../.env.production
    environment:
      DATABASE_URL: postgresql+psycopg://${PG_USER:-rag}:${PG_PASSWORD}@postgres:5432/${PG_DB:-ragdb}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_ENABLED: "true"
      # ---- 数据目录：必须与下面 volumes 的挂载点逐一对应 ----
      # 这三个路径若与挂载点不一致（例如沿用 config.py 的默认 "./data/docs"，
      # 相对于 WORKDIR /app/backend 会落到容器可写层），卷就是空的，
      # 表现为"升级容器后上传的文档和应用日志全没了"。
      APP_DATA_DIR: /data/app         # ↔ appdata  （会话/审计/反馈/令牌/授权）
      DOC_UPLOAD_DIR: /data/docs      # ↔ ragdocs  （上传的原始文档）
      LOG_DIR: /data/logs             # ↔ raglogs  （应用日志）
      # 备份落到独立卷：容器重建/升级时备份不丢（禁止落在容器可写层）
      BACKUP_DIR: /data/backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      # 私有化交付：默认走本地 vLLM（离线推理）；如需云端 LLM 需显式 ALLOW_CLOUD_LLM=true
      LLM_BACKEND: ${LLM_BACKEND:-vllm}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://vllm:8000/v1}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    expose:
      - "8000"
    volumes:
      - appdata:/data/app        # 会话/反馈/版本/审计等持久化数据
      - ragdocs:/data/docs       # 上传的原始文档
      - raglogs:/data/logs       # 应用日志
      - backupdata:/data/backups # 备份产物（含 pg_dump 全量）
      - ${MODEL_DIR:-/data/models}:/data/models:ro   # BGE / BERT-tiny / LLM 权重（只读）
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [rag-internal, rag-edge]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging: *default-logging
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=64m

  web:
    image: nginx:1.25-alpine
    container_name: rag-web
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api_proxy.inc:/etc/nginx/conf.d/api_proxy.inc:ro
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro   # server.crt / server.key
    depends_on:
      api: {condition: service_healthy}
    networks: [rag-edge]
    logging: *default-logging
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  # ---- 本地大模型推理（需 GPU；无 GPU 客户可不启用，改用自有的 OpenAI 兼容服务）----
  vllm:
    image: vllm/vllm-openai:v0.6.3
    container_name: rag-vllm
    profiles: ["gpu"]
    command:
      - "--model"
      - "${LLM_MODEL_PATH:-/models/qwen-14b-chat}"
      - "--served-model-name"
      - "${LLM_MODEL:-qwen-14b-chat}"
      - "--gpu-memory-utilization"
      - "${GPU_MEMORY_UTILIZATION:-0.9}"
      - "--max-model-len"
      - "8192"
    volumes:
      - ${MODEL_DIR:-/data/models}:/models:ro
    expose:
      - "8000"
    networks: [rag-internal]
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, count: 1, capabilities: [gpu]}
    logging: *default-logging
    restart: unless-stopped

networks:
  rag-internal:   # 数据库/缓存/推理：不出公网
    driver: bridge
    internal: true
  rag-edge:       # 前端与 API 对外
    driver: bridge

volumes:
  pgdata:
  redisdata:
  appdata:
  ragdocs:
  raglogs:
  backupdata:
