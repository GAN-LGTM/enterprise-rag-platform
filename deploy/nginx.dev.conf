# ============================================================
# 开发/联调反向代理（纯 HTTP，不启用 TLS）
#
# 为什么单独一份：生产用的 nginx.conf 监听 443 并要求 /etc/nginx/certs 下的证书，
# 开发机没有证书、也没映射 443 端口，直接拿它启动 nginx 会立刻失败
# （cannot load certificate / open() api_proxy.inc failed）。
# 开发只需"前端静态站 + API 反代"，所以这里去掉 TLS/限流，保留 SSE 必需配置。
#
#   开发：docker compose -f deploy/docker-compose.yml up -d   → http://localhost
#   生产：docker compose --env-file .env.production -f deploy/docker-compose.prod.yml up -d
#
# 注意：本文件同样 include api_proxy.inc，compose 里必须把它挂载进容器，
#      否则 nginx 会因找不到被 include 的文件而启动失败。
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与后端 MAX_UPLOAD_MB 保持一致（默认 50），避免"网关放行后被后端拒绝"的模糊错误
    client_max_body_size 50m;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        include /etc/nginx/conf.d/api_proxy.inc;   # 必含 SSE 关闭缓冲等配置
    }
}
