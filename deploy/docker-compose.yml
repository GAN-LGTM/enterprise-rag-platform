# ============================================================
# 企业级知识检索中台 —— 一键部署（Docker Compose）
#   启动：docker compose up -d
#   停止：docker compose down
#   说明：全部组件内网运行，启动后零外网流量
# ============================================================
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag123
      POSTGRES_DB: ragdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../sql:/docker-entrypoint-initdb.d:ro   # 首次启动自动建表建索引
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragdb"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    command: ["redis-server", "--maxmemory", "2gb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ..            # 项目根目录（backend/ 与 requirements.txt 都在那）
      dockerfile: deploy/Dockerfile
    container_name: rag-api
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag123@postgres:5432/ragdb
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      # 私有化生产：改成 vllm 并指向下面的 vllm 服务
      LLM_BACKEND: ${LLM_BACKEND:-mock}
      LLM_BASE_URL: http://vllm:8000/v1
    ports:
      - "8000:8000"
    volumes:
      - ragdocs:/data/docs
      - raglogs:/data/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: rag-web
    ports:
      - "80:80"
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      # 开发用 HTTP 版配置：生产那份要求 443 + TLS 证书，开发机没有证书会起不来
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      # nginx.dev.conf 里 include 了它：不挂载则 nginx 启动即报 open() failed
      - ./api_proxy.inc:/etc/nginx/conf.d/api_proxy.inc:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ---- 本地大模型推理（需要 GPU，按需启用：docker compose --profile gpu up -d）----
  vllm:
    image: vllm/vllm-openai:latest
    container_name: rag-vllm
    profiles: ["gpu"]
    command:
      - "--model"
      - "/models/qwen-14b-chat"
      - "--served-model-name"
      - "qwen-14b-chat"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--max-model-len"
      - "8192"
    volumes:
      - /data/models/qwen-14b:/models/qwen-14b-chat
    ports:
      - "8100:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  pgdata:
  ragdocs:
  raglogs:
