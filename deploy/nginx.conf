# ============================================================
# 生产反向代理：前端静态站 + API 反代 + TLS + 安全头 + 限流
#   证书：把 server.crt / server.key 放到 deploy/certs/（或用 TLS_CERT_DIR 指定）
#   关键：SSE 流式必须关闭缓冲，否则流式会退化成一次性返回
# ============================================================
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;

# ---- HTTP：仅用于跳转 HTTPS（内网 HTTP 直连客户可删除本段并把 443 段改成 80）----
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # 文档上传体积上限：必须与后端 MAX_UPLOAD_MB 保持一致（默认 50）。
    # 若此处大于后端限制，文件会在网关放行后被后端拒绝，用户只看到一个模糊错误。
    client_max_body_size 50m;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 登录接口单独限流，防止口令爆破
    location /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        include /etc/nginx/conf.d/api_proxy.inc;
    }

    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        include /etc/nginx/conf.d/api_proxy.inc;
    }
}
